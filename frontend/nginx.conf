server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # blob: required for in-app DocumentViewer (PDF iframe + image object URLs).
    # frame-src blob: for PDF previews; img-src blob: for screenshots/scans.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; frame-src 'self' blob:; child-src 'self' blob:; img-src 'self' data: blob: https:; object-src 'self' blob:; script-src 'self'; style-src 'self' 'unsafe-inline'" always;

    # Cache built, fingerprinted assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Reverse-proxy the API to the backend compose service.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;

        # Allow uploads of documents/evidence. 120m admits multi-file batches
        # and C-file ZIP dumps; the backend still enforces 50 MB per file
        # (plus its own per-archive ZIP caps).
        client_max_body_size 210m;
    }

    # Public probe compatibility for load balancers and external monitors. API-prefixed
    # aliases exist too, but these preserve the conventional paths documented by Valor.
    location = /healthz {
        proxy_pass http://backend:8000/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    location = /readyz {
        proxy_pass http://backend:8000/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    # PWA manifest — nginx's default mime.types omits .webmanifest, so set the
    # correct type explicitly (the file itself is served from the SPA root).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    # SPA fallback — every other route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
